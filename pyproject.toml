[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localrag"
version = "0.1.0"
description = "Fully offline, self-hosted RAG server: documents in, cited answers out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "chromadb",
    "sentence-transformers",
    "pypdf",
    "python-multipart",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
localrag = "localrag.cli:main"

# explicit packages entry so non-.py data files (ui/*.html) ship in the wheel
[tool.hatch.build.targets.wheel]
packages = ["localrag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
